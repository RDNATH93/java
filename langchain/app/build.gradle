plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'java'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    implementation 'dev.langchain4j:langchain4j:1.7.1'
    implementation 'dev.langchain4j:langchain4j-ollama:1.7.1'
    implementation 'dev.langchain4j:langchain4j-open-ai:1.7.1'
    implementation 'org.slf4j:slf4j-api:2.0.17'
    implementation 'org.slf4j:slf4j-simple:2.0.17'
    implementation 'dev.langchain4j:langchain4j-code-execution-engine-judge0:1.7.1-beta14'
    implementation 'dev.langchain4j:langchain4j-mcp:1.7.1-beta14'
    implementation 'dev.langchain4j:langchain4j-easy-rag:1.7.1-beta14'
    implementation 'dev.langchain4j:langchain4j-embeddings-bge-small-en-v15-q:1.7.1-beta14'
    implementation 'dev.langchain4j:langchain4j-pgvector:1.7.1-beta14'

    implementation 'dev.langchain4j:langchain4j-experimental-sql:1.7.1-beta14'
    implementation 'dev.langchain4j:langchain4j-embedding-store-filter-parser-sql:1.7.1-beta14'

    implementation 'dev.langchain4j:langchain4j-web-search-engine-tavily:1.7.1-beta14'

    //to re-rank content 
    implementation 'dev.langchain4j:langchain4j-cohere:1.7.1-beta14'

    //to build agents
    implementation 'dev.langchain4j:langchain4j-agentic:1.7.1-beta14'

    implementation 'org.postgresql:postgresql:42.7.7'
    implementation 'com.zaxxer:HikariCP:6.3.0'

    // to persist chat messages
    implementation 'org.mapdb:mapdb:3.1.0'

    implementation 'com.h2database:h2:2.3.232'
   
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testImplementation 'org.assertj:assertj-core:3.27.3'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is used by the application.
    implementation libs.guava
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}


tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}
